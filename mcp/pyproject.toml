[project]
name = "line-mcp"
version = "0.1.0"
description = "FastMCP server exposing LINE inbox to Claude Desktop"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.2.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "lib"]
